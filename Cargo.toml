[workspace]
resolver = "3"
members = [
    "crates/jerrycan",
    "crates/jerrycan-core",
    "crates/jerrycan-macros",
    "crates/jerrycan-db",
    "crates/jerrycan-auth",
    "crates/jerrycan-validate",
    "crates/jerrycan-observe",
    "crates/jerrycan-ratelimit",
    "crates/jerrycan-jobs",
    "crates/jerrycan-storage",
    "crates/jerrycan-realtime",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.7.8"
edition = "2024"
license = "MIT"
homepage = "https://jerrycan.cc"
repository = "https://github.com/backant-io/jerrycan"
authors = ["Pavel Hegler"]
rust-version = "1.97"

[workspace.dependencies]
jerrycan-core = { path = "crates/jerrycan-core", version = "0.7.2" }
jerrycan-macros = { path = "crates/jerrycan-macros", version = "0.7.2" }
jerrycan-db = { path = "crates/jerrycan-db", version = "0.7.2" }
jerrycan-validate = { path = "crates/jerrycan-validate", version = "0.7.2" }
jerrycan-auth = { path = "crates/jerrycan-auth", version = "0.7.2" }
jerrycan-observe = { path = "crates/jerrycan-observe", version = "0.7.2" }
jerrycan-ratelimit = { path = "crates/jerrycan-ratelimit", version = "0.7.2" }
jerrycan-jobs = { path = "crates/jerrycan-jobs", version = "0.7.2" }
jerrycan-storage = { path = "crates/jerrycan-storage", version = "0.7.2" }
jerrycan-realtime = { path = "crates/jerrycan-realtime", version = "0.7.2" }
# Realtime WS transport. No TLS features: server-side it rides hyper's already-
# accepted socket; the test client connects plain ws:// on loopback. Verified
# 0.30.0 current on docs.rs (from_raw_socket + inherent send +
# handshake::derive_accept_key are the APIs we use).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
# The dedicated logical-replication client (pgoutput, rustls TLS via the `ring`
# provider, SCRAM). It owns the WAL socket / startup / auth / framing / standby
# status; sqlx stays the sole data-layer client. Verified 0.3.2 on crates.io.
pgwire-replication = { version = "0.3.2", default-features = false, features = ["tls-rustls", "scram"] }
# Third-party ID-token (Sign in with Apple / Google) verification, behind
# jerrycan-auth's `idtoken` feature only. 10.3+ fixes GHSA-h395-gr6q-cpjc (type
# confusion → authorization bypass). jsonwebtoken 10 dropped its built-in `ring`
# backend for pluggable CryptoProviders whose built-ins are `aws_lc_rs` (a second
# native crypto stack beside ring) or `rust_crypto` (pulls the pure-Rust `rsa`
# crate and with it the RUSTSEC-2023-0071 Marvin advisory) — so BOTH stay off and
# jerrycan-auth installs its own RS256-only provider backed by `ring` (below),
# the crypto backend already in the tree through hyper-rustls/rustls. `use_pem`
# is enabled for the in-test token signer.
jsonwebtoken = { version = "10.3", default-features = false, features = ["use_pem"] }
# Backs jerrycan-auth's RS256-only jsonwebtoken CryptoProvider (see above). Same
# version rustls already links; `std` for the error-source impls the provider's
# error mapping needs.
ring = { version = "0.17", features = ["std"] }
argon2 = "0.5"
bcrypt = "0.17"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "script"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres"] }
# Floor 1.1.17: `ConnectOptions::map_sqlx_sqlite_opts` (jerrycan-db pins
# SQLite `foreign_keys=ON` through it) first shipped in that release.
sea-orm = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "macros", "with-json"] }
sea-query = { version = "0.32", default-features = false, features = ["backend-sqlite", "backend-postgres"] }
sea-query-binder = { version = "0.7", default-features = false, features = ["sqlx-any"] }
# Supabase-dump SQL parsing for `jerrycan migrate` (pure Rust, MIT OR Apache-2.0).
sqlparser = "0.62"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
# OAuth outbound client (behind jerrycan-auth's `oauth` feature only). rustls-only
# via the `ring` provider + `webpki-roots` bundled roots — no openssl, no
# native-certs. `client-legacy` gives the high-level `hyper_util` client.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
webpki-roots = "1"
# Direct handle on rustls only to pick the `ring` crypto provider explicitly
# (so the OAuth client never depends on a process-global default being installed).
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
# S3 XML parsing (error + multipart-initiate bodies only; listing is DB-backed
# so object keys never round-trip through XML). Pure safe Rust, MIT. 0.41+ closes
# RUSTSEC-2026-0194/0195 (attribute/namespace DoS). The `encoding` feature gates
# `BytesText::decode()`, which replaced the removed `unescape()` in xml.rs.
quick-xml = { version = "0.41", features = ["encoding"] }
bytes = "1"
futures-core = "0.3"
# SinkExt/StreamExt over tokio-tungstenite's Sink/Stream impls (WebSocketStream
# has no inherent send/next in 0.30). `sink` adds SinkExt on top of the default std set.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
