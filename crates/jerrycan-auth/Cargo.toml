[package]
name = "jerrycan-auth"
description = "Authentication extension for the jerrycan framework: argon2 password hashing, encrypted sessions, JWT, role guards. https://jerrycan.cc"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["auth", "jwt", "session", "argon2"]
categories = ["authentication"]

[dependencies]
jerrycan-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
argon2.workspace = true
bcrypt.workspace = true
chacha20poly1305.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
zeroize.workspace = true

# OAuth2 client (feature-gated). All optional: the base crate (no `oauth`) gains
# nothing from these. rustls-only — see the workspace `hyper-rustls` entry.
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, features = ["client", "client-legacy"], optional = true }
hyper-rustls = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

# Third-party ID-token verifier (feature `idtoken`). RS256 + JWKS component
# decoding via jsonwebtoken. jsonwebtoken 10 has no built-in `ring` backend, so
# `idtoken` also pulls `ring` directly and installs an RS256-only CryptoProvider
# over it (idtoken.rs) — keeping the `rsa` crate (RUSTSEC-2023-0071) and a second
# native crypto stack (`aws_lc_rs`) out of the artifact. The JWKS fetch reuses
# the same optional hyper + hyper-rustls client the `oauth` feature pulls.
jsonwebtoken = { workspace = true, optional = true }
ring = { workspace = true, optional = true }

[features]
# OAuth2 authorization-code client + provider presets.
# Pulls an outbound HTTPS client (hyper + hyper-rustls, rustls/ring only).
oauth = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:bytes",
    "dep:webpki-roots",
    "dep:rustls",
]
# The deterministic in-process mock OAuth2 IdP (test/eval-only harness). Kept OFF
# of `oauth` so the token-minting harness can't compile into a normal prod client
# build; the v2.5 eval + generated tests opt in explicitly. Needs the oauth types.
mock-idp = ["oauth"]
# Third-party ID-token (Sign in with Apple / Google Sign-In) verifier: RS256 JWS
# validation against a provider JWKS. Pulls jsonwebtoken plus `ring` (backing the
# RS256-only CryptoProvider jsonwebtoken 10 requires) plus the same outbound
# HTTPS client the `oauth` feature uses, for the JWKS fetch.
idtoken = [
    "dep:jsonwebtoken",
    "dep:ring",
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:bytes",
    "dep:webpki-roots",
    "dep:rustls",
]

[dev-dependencies]
tokio.workspace = true
criterion = { workspace = true }

[[bench]]
name = "auth_bench"
harness = false
