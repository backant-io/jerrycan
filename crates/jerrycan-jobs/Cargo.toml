[package]
name = "jerrycan-jobs"
description = "Background job engine for the jerrycan framework: at-least-once queues, retries + dead-letter, cron, run_at, Postgres or Redis store. https://jerrycan.cc"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jobs", "queue", "cron", "background", "worker"]
categories = ["web-programming", "asynchronous"]

[dependencies]
jerrycan-core = { workspace = true }
jerrycan-db = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
redis = { workspace = true, optional = true }

[features]
jobs-redis = ["dep:redis"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
