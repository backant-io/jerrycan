[package]
name = "jerrycan-core"
description = "Core of the jerrycan framework: routing, extractors, dependency injection, middleware. https://jerrycan.cc"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "async", "http"]
categories = ["web-programming::http-server"]

[dependencies]
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "test-util"] }
criterion = { workspace = true }

[[bench]]
name = "core_bench"
harness = false
