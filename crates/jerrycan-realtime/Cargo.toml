[package]
name = "jerrycan-realtime"
description = "Realtime extension for the jerrycan framework: WebSocket channels for Postgres Changes (logical replication with trigger fallback), Broadcast, and Presence, with scope-filtered delivery. https://jerrycan.cc"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["realtime", "websocket", "cdc", "pubsub", "presence"]
categories = ["web-programming", "asynchronous"]

[dependencies]
jerrycan-core = { workspace = true }
jerrycan-db = { workspace = true }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
hyper = { workspace = true }
hyper-util = { workspace = true }
futures-core.workspace = true
futures-util = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "net", "io-util"] }
tokio-tungstenite = { workspace = true }
# The dedicated logical-replication client (WAL socket only — pgoutput, rustls
# TLS, SCRAM). sqlx/sea-orm stays the sole data-layer client.
pgwire-replication = { workspace = true }
# PgListener (trigger fallback) + the dedicated advisory-lock leader session.
sqlx = { workspace = true }
# The multi-node fan-out bus (behind `realtime-redis`, like jobs-redis).
redis = { workspace = true, optional = true }

[features]
realtime-redis = ["dep:redis"]

[dev-dependencies]
jerrycan-core = { workspace = true }
jerrycan-db = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { workspace = true }
futures-core.workspace = true
futures-util = { workspace = true }

# `ChangeChannelSpec` is the generated-wiring contract: realtimegen ALWAYS emits
# a full struct literal setting every field, so adding an opt-in field to it
# (0.6.18: `hidden_columns`, #167 — the write_only columns projected out of the
# changes broadcast) is additive for every real consumer (generated code) yet
# trips `constructible_struct_adds_field`, which for a 0.x crate would force a
# spurious 0.x-major bump. A derived `Default` keeps the struct constructible via
# struct-update. Scope-allow that one lint for this package (mirrors the 0.6.1
# precedent on `jerrycan`). TRADEOFF (tracked, #145): re-enable once the config
# structs are `#[non_exhaustive]` (a future 0.x-major).
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
