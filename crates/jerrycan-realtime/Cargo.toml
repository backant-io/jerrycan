[package]
name = "jerrycan-realtime"
description = "Realtime extension for the jerrycan framework: WebSocket channels for Postgres Changes (logical replication with trigger fallback), Broadcast, and Presence, with scope-filtered delivery. https://jerrycan.cc"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["realtime", "websocket", "cdc", "pubsub", "presence"]
categories = ["web-programming", "asynchronous"]

[dependencies]
jerrycan-core = { workspace = true }
jerrycan-db = { workspace = true }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
hyper = { workspace = true }
hyper-util = { workspace = true }
futures-core.workspace = true
futures-util = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "net", "io-util"] }
tokio-tungstenite = { workspace = true }
# The dedicated logical-replication client (WAL socket only — pgoutput, rustls
# TLS, SCRAM). sqlx/sea-orm stays the sole data-layer client.
pgwire-replication = { workspace = true }
# PgListener (trigger fallback) + the dedicated advisory-lock leader session.
sqlx = { workspace = true }
# The multi-node fan-out bus (behind `realtime-redis`, like jobs-redis).
redis = { workspace = true, optional = true }

[features]
realtime-redis = ["dep:redis"]

# 0.7.3 (#216): `ChangeChannelSpec` and `ChangeEvent` are now `#[non_exhaustive]`
# so future scope-key field-adds (owner_column was the first) stay a non-breaking
# minor. `ChangeChannelSpec` is literal-built ONLY by realtimegen-generated
# downstream code, which this release converts to the `ChangeChannelSpec::new(..)`
# builder in lockstep — no external consumer literal-constructs either struct.
# The ONE-TIME exhaustive→non_exhaustive transition trips
# `struct_marked_non_exhaustive` (a 0.x-major lint); scope-allow it for this
# release only. Once 0.7.3 is the published baseline the structs are already
# non_exhaustive, the lint can never fire again, and this allow can be removed.
[package.metadata.cargo-semver-checks.lints]
struct_marked_non_exhaustive = "allow"

[dev-dependencies]
jerrycan-core = { workspace = true }
jerrycan-db = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { workspace = true }
futures-core.workspace = true
futures-util = { workspace = true }
