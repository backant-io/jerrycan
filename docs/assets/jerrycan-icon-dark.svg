<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 136" width="128" height="136" role="img" aria-label="jerrycan icon">
  <g fill="none" stroke="#F2F2F0" stroke-linecap="round" stroke-linejoin="round">
    <!-- body: portrait, like the real can -->
    <rect x="22" y="30" width="84" height="94" rx="10" stroke-width="7"/>
    <!-- filler cap with brim, top left -->
    <path d="M32 30 v-6 h12 v6" stroke-width="6"/>
    <path d="M29 20 h18" stroke-width="6"/>
    <!-- three carry handles -->
    <path d="M58 30 v-5 h9 v5" stroke-width="5.5"/>
    <path d="M74 30 v-5 h9 v5" stroke-width="5.5"/>
    <path d="M90 30 v-5 h9 v5" stroke-width="5.5"/>
    <!-- recessed panel -->
    <rect x="34" y="44" width="60" height="66" rx="7" stroke-width="5"/>
    <!-- stamped X brace -->
    <path d="M40 51 L88 103" stroke-width="5"/>
    <path d="M88 51 L40 103" stroke-width="5"/>
  </g>
</svg>
