[package]
name = "jerrycan-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jerrycan-core = { path = "../crates/jerrycan-core" }
jerrycan-auth = { path = "../crates/jerrycan-auth" }
jerrycan-jobs = { path = "../crates/jerrycan-jobs" }
# `cli` exposes `jerrycan::platform::design::Design` (the design_parse target).
jerrycan = { path = "../crates/jerrycan", default-features = false, features = ["cli"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "decode_segment"
path = "fuzz_targets/decode_segment.rs"
test = false
doc = false

[[bin]]
name = "session_decode"
path = "fuzz_targets/session_decode.rs"
test = false
doc = false

[[bin]]
name = "jwt_decode"
path = "fuzz_targets/jwt_decode.rs"
test = false
doc = false

[[bin]]
name = "design_parse"
path = "fuzz_targets/design_parse.rs"
test = false
doc = false

[[bin]]
name = "multipart_parse"
path = "fuzz_targets/multipart_parse.rs"
test = false
doc = false

[[bin]]
name = "cron_parse"
path = "fuzz_targets/cron_parse.rs"
test = false
doc = false
