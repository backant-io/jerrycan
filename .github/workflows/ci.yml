name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  JERRYCAN_TEST_PG_URL: postgres://postgres:jerrycan@localhost:5432/jerrycan_test

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: jerrycan
          POSTGRES_DB: jerrycan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl + container tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Install verification tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Audit (RustSec advisories)
        run: cargo audit
      - name: Deny (licenses, bans, sources, yanked)
        run: cargo deny check
      - name: Tests (unit + integration + doc-tests)
        run: cargo test --workspace --all-features
      - name: Build benches
        run: cargo build --workspace --benches --all-features
      - name: Build facade with no default features (generated-app config)
        run: cargo build -p jerrycan --no-default-features
      - name: "Conformance (heavy: generated apps must build, check, serve, and pass the scripted eval)"
        run: |
          cargo test -p jerrycan --all-features --test conformance -- --include-ignored
          cargo test -p jerrycan --test genroute_compile -- --include-ignored
          cargo test -p jerrycan --test eval -- --include-ignored
      - name: Docs build (broken intra-doc links are errors)
        run: cargo doc --workspace --no-deps --all-features

  fuzz-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build fuzz targets
        run: cargo install cargo-fuzz && cargo +nightly fuzz build
