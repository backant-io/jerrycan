name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only checks out and builds/tests. None writes
# to the repo, issues, or checks, so the whole workflow gets read-only scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain, components, and the musl target all come from
      # rust-toolchain.toml (pinned to 1.97 == the declared MSRV). Keep this
      # version in sync with that file when bumping stable.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install verification tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-semver-checks
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Audit (RustSec advisories)
        run: cargo audit
      - name: Deny (licenses, bans, sources, yanked)
        run: cargo deny check
      - name: Semver checks (no unintended breaking API change vs the published baseline)
        # These 11 crates are on crates.io; their latest published baseline is
        # 0.4.1. jerrycan-jobs/-ratelimit/-storage/-realtime published with 0.4.1 —
        # add them to this list on the next release touching their APIs. For a 0.x crate
        # cargo-semver-checks treats the middle number as the major, so a breaking
        # change requires a 0.x-major bump — the workspace declares 0.4.x (the
        # Failure envelope fields broke 0.3.0's literal contract; Failure is now
        # non_exhaustive so field additions stop being breaking). This gate stays
        # honest: the next breaking change must bump to 0.5.0 (baseline 0.4.1), and it tightens to
        # patch-level once the crates go 1.0.
        run: >-
          cargo semver-checks check-release
          -p jerrycan-core -p jerrycan-macros -p jerrycan-db -p jerrycan-auth
          -p jerrycan-validate -p jerrycan-observe -p jerrycan
      - name: Tests (unit + integration + doc-tests)
        run: cargo test --workspace --all-features
      - name: Build benches
        run: cargo build --workspace --benches --all-features
      - name: Build facade with no default features (generated-app config)
        run: cargo build -p jerrycan --no-default-features
      - name: Docs build (broken intra-doc links are errors)
        run: cargo doc --workspace --no-deps --all-features

  # The declared MSRV (Cargo.toml `rust-version`) now equals the pinned stable in
  # rust-toolchain.toml (1.97), so the `gate` job already builds and tests the
  # whole workspace on the MSRV — a separate MSRV job would be redundant (and,
  # because rust-toolchain.toml overrides any job-level toolchain, could not pin a
  # lower version anyway). Reintroduce one only if MSRV is ever set below stable.

  fuzz-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build fuzz targets
        run: cargo install cargo-fuzz && cargo +nightly fuzz build
