name: Release

# Prebuilt `jerrycan` binaries on every version tag (onboarding spec §4.1:
# taiki-e matrix). crates.io publishing stays scripts/publish.sh with its
# fail-fast eval gate — this workflow only attaches binaries + sha256 checksums
# to the GitHub release, for install.sh and cargo-binstall. Tag AFTER the
# crates.io publish succeeds, so a binary release can never lead the registry.
#
# The manual dispatch path backfills assets onto an EXISTING release whose
# matrix legs failed (v0.6.0–v0.6.2 shipped 2/4 assets): it checks out the tag
# and re-uploads, without re-creating the release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to backfill assets onto (e.g. v0.6.2)"
        required: true
        type: string

# create-gh-release / upload-rust-binary write release assets; nothing else.
permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag != workspace version $ver" >&2
            exit 1
          fi
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    # On dispatch create-release is skipped; still run the uploads.
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # macos-13 (the last x86_64 macOS runner) is retired — its leg queued
          # 24h then cancelled on v0.6.0–v0.6.2. Cross-compile from arm64
          # instead; the Apple toolchain supports it natively with plain cargo.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # A retired/unavailable runner otherwise queues until the 24h run limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      # Same pin discipline as ci.yml: keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: jerrycan
          target: ${{ matrix.target }}
          # Force plain cargo: the action's own cross-detection invoked `cross`
          # on the arm64 runner and tried to install an x86_64 host toolchain
          # (v0.6.x failure). Every leg here is host-native or an Apple
          # cross-compile that cargo handles directly.
          build-tool: cargo
          checksum: sha256
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
